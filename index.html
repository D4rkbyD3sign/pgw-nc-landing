<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Security (spec §10.1). GitHub Pages cannot send headers, so the policy rides in meta tags. It allows ONLY what the
     page uses: our own files; the app's origin (its data module, partner logos, speaker photos); YouTube's poster
     images; and the two tap-to-load frames (the trailer on youtube-nocookie, the venue map on Google Maps).
     No inline script anywhere (no 'unsafe-inline'). Fonts are self-hosted, so no Google host appears before a tap.
     ⚠ frame-ancestors is ignored in a meta tag, so framing cannot be refused on Pages (spec §10.1 item 2: accepted). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://app.pgwconference.com.au; style-src 'self'; img-src 'self' https://app.pgwconference.com.au https://i.ytimg.com; font-src 'self'; media-src 'self'; connect-src 'self' https://app.pgwconference.com.au; frame-src https://www.youtube-nocookie.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- skin:head — stamped from skin/2026.js by build/tools/gen_skin.py. Static on purpose: scrapers and crawlers do not run JS. -->
<title>ImplementAI 2026 · PGW National Conference</title>
<meta name="description" content="29–30 October · Hobart">
<meta property="og:title" content="ImplementAI 2026 · PGW National Conference">
<meta property="og:description" content="29–30 October · Hobart">
<meta property="og:image" content="https://pgwconference.com.au/img/og-1200x630.jpg">
<meta property="og:url" content="https://pgwconference.com.au/">
<meta name="twitter:card" content="summary_large_image">
<!-- /skin:head -->
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/screen.css">
<link rel="stylesheet" href="css/landing.css">
<link rel="stylesheet" href="css/flair.css">
<script src="js/head.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<!-- skin:gate — the gate screen (spec §5.20), stamped by gen_skin.py ONLY while skin.gate is true. Static, so it shows without JS. -->
<!-- /skin:gate -->
<!-- skin:noscript — without JavaScript (and only when ungated): the text title on charcoal (spec §5.13). Stamped by gen_skin.py. -->
<noscript><div class="screen-dark"><header class="screen-top wrap"><img class="screen-logo" src="img/logo-white.svg" alt="PGW" width="186" height="26"></header><main class="screen-main screen-words"><p class="eyebrow">PGW National Conference 2026</p><h1 class="screen-h">ImplementAI<br>2026</h1></main></div></noscript>
<!-- /skin:noscript -->
<!--
  PGW shell. The page lives in the <template> below and is NOT in the document until js/main.js mounts it: after the
  gate opens (spec §2.6: "the page beneath renders only after unlock"), or at once when the skin has gate: false.
  Every section is present in the template; main.js removes the ones the current state does not show (spec §2.4)
  and fills every word from skin/2026.js. App links are CREATED by script only when appOpen is true: there is no
  app link in this markup, hidden or otherwise (spec §9).
-->
<template id="shell">
  <!-- ===== THE LOAD-IN (spec §5.13): full-screen charcoal, the title sequence, the top bar, the hero words ===== -->
  <section class="loadin" data-section="loadin" aria-labelledby="hero-h">
    <div class="loadin-frame">
      <img class="loadin-still" alt="" decoding="async" data-slot="still">
      <!-- No autoplay attribute: js/loadin.js adds the sources and starts it, never under reduced motion. Silent, always. -->
      <video class="loadin-film" muted playsinline preload="auto" aria-hidden="true" tabindex="-1" data-slot="film"></video>
      <span class="po-line" aria-hidden="true"></span>
      <div class="wrap loadin-in">
        <header class="top top--dark">
          <img class="logo" src="img/logo-white.svg" alt="PGW" width="186" height="26">
          <div data-slot="topbar-app"></div>
        </header>
        <div class="loadin-words" data-slot="words">
          <div class="motif" data-slot="motif"></div>
          <p class="eyebrow" data-text="heroEyebrow"></p>
          <h1 id="hero-h"><span data-text="title.lead"></span><span class="ai" data-text="title.mark"></span><br><span class="year" data-text="title.year"></span></h1>
          <p class="when" data-slot="when"></p>
          <p class="tagline" data-slot="tagline"></p>
        </div>
      </div>
    </div>
    <!-- THE PINNED FOOT: outside the clipped frame, so the pull-back can never slice it. -->
    <div class="loadin-foot wrap" data-slot="foot">
      <a class="cue" href="#monitor" data-text="loadin.scroll"></a>
      <button class="film-ctl" type="button" data-slot="film-ctl" hidden></button>
    </div>
  </section>

  <div class="page" id="page">
    <!-- WRAPPED only: the plain top bar on paper, logo only (spec §2.4). -->
    <div class="wrap" data-section="topbar-wrapped">
      <header class="top"><img class="logo" src="img/logo-base.svg" alt="PGW" width="186" height="26"></header>
    </div>

    <!-- WRAPPED only: THE HERO WINDOW (spec §5.9b), a window onto Hobart at dusk where the PGW mark powers on. The trace's first
         node (§5.15): the power lead enters its left edge. The markup is the END state (full-brightness image, filled mark);
         js/flair.js adds the unpowered classes. The alt is filled from the skin (copy.wrappedFlair.heroAlt), never typed here. -->
    <div class="wrap" data-section="hero-wrapped">
      <figure class="whero" data-node>
        <div class="whero-win">
          <img class="whero-img" src="img/hobart-2000.jpg" srcset="img/hobart-1000.jpg 1000w, img/hobart-2000.jpg 2000w"
               sizes="(min-width: 1120px) 1040px, calc(100vw - 40px)" width="1920" height="1080" decoding="async" data-alt="wrappedFlair.heroAlt">
          <div class="whero-veil"></div>
            <!-- The PGW mark: the awards deck's svg.mark (ceremony.html, viewBox 0 0 622.2 630.1), its four d values copied by script,
                 never redrawn. Drawn twice: the OUTLINE copy (the unpowered look) and the FILLED copy; then the paper dash for the ring. -->
            <svg class="whero-mark" viewBox="0 0 622.2 630.1" aria-hidden="true" focusable="false">
              <g class="outline">
                <path class="ring" d="M46.82 435.66 C57.66 469.68 74.43 500.16 95.59 526.36 L111.59 451.40 C106.48 441.17 102.05 430.44 98.47 419.20 C60.74 300.73 126.19 174.09 244.67 136.35 C282.90 124.17 321.96 122.77 358.62 130.41 L413.55 112.91 L418.36 92.19 C359.90 68.33 293.08 64.04 228.21 84.70 C81.21 131.52 0.00 288.65 46.82 435.66 M448.69 530.58 C522.80 474.62 557.31 376.05 527.52 282.54 C523.76 270.73 519.09 259.46 513.65 248.76 L530.52 175.55 C551.63 201.72 568.35 232.13 579.17 266.09 C622.24 401.30 556.98 545.08 431.83 603.71 L448.69 530.58"/>
                <path class="bar b0" d="M120.03 552.92 L169.17 322.67 L246.65 297.99 L183.75 598.51 C160.58 586.42 139.09 571.10 120.03 552.92"/>
                <path class="bar b1" d="M286.31 629.00 L393.95 150.06 L316.47 174.74 L217.86 613.52 C239.79 621.48 262.78 626.73 286.31 629.00"/>
                <path class="bar b2" d="M398.60 616.77 L540.78 0.00 L464.33 24.35 L323.74 630.07 C348.33 629.11 373.19 624.88 397.78 617.04 C398.06 616.96 398.33 616.86 398.60 616.77"/>
              </g>
              <g class="fill glow">
                <path class="ring" d="M46.82 435.66 C57.66 469.68 74.43 500.16 95.59 526.36 L111.59 451.40 C106.48 441.17 102.05 430.44 98.47 419.20 C60.74 300.73 126.19 174.09 244.67 136.35 C282.90 124.17 321.96 122.77 358.62 130.41 L413.55 112.91 L418.36 92.19 C359.90 68.33 293.08 64.04 228.21 84.70 C81.21 131.52 0.00 288.65 46.82 435.66 M448.69 530.58 C522.80 474.62 557.31 376.05 527.52 282.54 C523.76 270.73 519.09 259.46 513.65 248.76 L530.52 175.55 C551.63 201.72 568.35 232.13 579.17 266.09 C622.24 401.30 556.98 545.08 431.83 603.71 L448.69 530.58"/>
                <path class="bar b0" d="M120.03 552.92 L169.17 322.67 L246.65 297.99 L183.75 598.51 C160.58 586.42 139.09 571.10 120.03 552.92"/>
                <path class="bar b1" d="M286.31 629.00 L393.95 150.06 L316.47 174.74 L217.86 613.52 C239.79 621.48 262.78 626.73 286.31 629.00"/>
                <path class="bar b2" d="M398.60 616.77 L540.78 0.00 L464.33 24.35 L323.74 630.07 C348.33 629.11 373.19 624.88 397.78 617.04 C398.06 616.96 398.33 616.86 398.60 616.77"/>
              </g>
              <path class="run" pathLength="100" d="M46.82 435.66 C57.66 469.68 74.43 500.16 95.59 526.36 L111.59 451.40 C106.48 441.17 102.05 430.44 98.47 419.20 C60.74 300.73 126.19 174.09 244.67 136.35 C282.90 124.17 321.96 122.77 358.62 130.41 L413.55 112.91 L418.36 92.19 C359.90 68.33 293.08 64.04 228.21 84.70 C81.21 131.52 0.00 288.65 46.82 435.66 M448.69 530.58 C522.80 474.62 557.31 376.05 527.52 282.54 C523.76 270.73 519.09 259.46 513.65 248.76 L530.52 175.55 C551.63 201.72 568.35 232.13 579.17 266.09 C622.24 401.30 556.98 545.08 431.83 603.71 L448.69 530.58"/>
            </svg>
        </div>
      </figure>
    </div>

    <main>
      <!-- ===== WRAPPED: the holding page's wrap block (spec §5.9) ===== -->
      <section class="wrapblock wrap" data-section="wrap" aria-labelledby="wrap-h" data-node>
        <p class="eyebrow" data-text="wrap.eyebrow"></p>
        <h1 class="wrap-h" id="wrap-h" data-slot="wrap-headline"></h1>
        <p class="wrap-p" data-text="wrap.thanks"></p>
        <!-- The crew photo (spec §5.9c): Johnny's photo from the Mustique cruise, after the thanks, before the V1/V2 line. No caption. -->
        <figure class="wcrew">
          <img src="img/cruise-1600.jpg" srcset="img/cruise-800.jpg 800w, img/cruise-1600.jpg 1600w" sizes="(min-width: 900px) 760px, calc(100vw - 40px)"
               width="1600" height="1200" loading="lazy" decoding="async" data-alt="wrappedFlair.crewAlt">
        </figure>
        <div data-slot="wrap-close"></div>
        <div class="wrap-action" data-slot="wrap-app"></div>
      </section>

      <!-- ===== WRAPPED: the encore (spec §5.9a), AFTER the whole wrap block, never inside it. Removed when encoreVideo is empty. ===== -->
      <section class="encore wrap" data-section="encore" aria-labelledby="encore-h" data-node>
        <h2 class="h" id="encore-h" data-text="encore.heading" data-anchor></h2>
        <p class="wrap-p" data-text="encore.line"></p>
        <div data-slot="encore-card"></div>
        <p class="encore-credit" data-slot="encore-credit"></p>
      </section>

      <!-- ===== THE MONITOR (spec §5.14): trailer + countdown in one charcoal card. The trace's first node. ===== -->
      <div class="wrap" data-section="monitor">
        <div class="monitor rv" id="monitor" data-node>
          <div class="monitor-screen">
            <div data-slot="trailer"></div>
            <div class="countdown" data-slot="countdown"></div>
          </div>
        </div>
      </div>

      <!-- ===== THE ACTION (spec §2.3 B), directly under the monitor ===== -->
      <div class="wrap action" data-section="action" data-slot="action"></div>

      <!-- ===== INTRO: the group photo + the three locked paragraphs (spec §5.5) ===== -->
      <section class="s intro-s wrap rv" data-section="intro" aria-labelledby="intro-open">
        <figure class="photos">
          <div class="ph-frame">
            <img class="ph-main" src="img/group-1200.jpg"
                 srcset="img/group-800.jpg 800w, img/group-1200.jpg 1200w, img/group-2000.jpg 2000w"
                 sizes="(min-width: 1120px) 1040px, (min-width: 900px) calc(100vw - 80px), calc(100vw - 40px)"
                 width="2000" height="1125" decoding="async" data-alt="photo.alt">
          </div>
          <figcaption data-text="photo.caption"></figcaption>
        </figure>
        <div class="intro" data-slot="intro"></div>
      </section>

      <!-- ===== WHAT'S PLANNED: greige band, a real full-width element (spec §3 item 5) ===== -->
      <div class="band band--greige" data-section="plan">
        <section class="s wrap rv" aria-labelledby="plan-h" data-node>
          <p class="eyebrow" data-text="labels.planEyebrow"></p>
          <h2 class="h" id="plan-h" data-text="labels.planHeading"></h2>
          <div data-slot="days"></div>
          <p class="cpd" data-slot="cpd"></p>
        </section>
      </div>

      <!-- ===== WHERE (spec §3 item 6) ===== -->
      <section class="s wrap rv" data-section="where" aria-labelledby="where-eyebrow" data-node>
        <p class="eyebrow" id="where-eyebrow" data-text="labels.whereEyebrow"></p>
        <div class="venue" data-slot="venue"></div>
      </section>

      <!-- ===== WHAT TO WEAR (spec §3 item 7, §5.18): rendered only while skin.whatToWear has cards (spec §6.3) ===== -->
      <section class="s wrap rv" data-section="bring" aria-labelledby="bring-h" data-node>
        <p class="eyebrow" data-text="labels.bringEyebrow"></p>
        <h2 class="h" id="bring-h" data-text="labels.bringHeading"></h2>
        <div class="wear" data-slot="bring"></div>
      </section>

      <!-- ===== EDUCATIONAL PARTNERS: charcoal band, a real full-width element (spec §5.7) ===== -->
      <div class="band band--dark" data-section="partners">
        <section class="s wrap rv" aria-labelledby="part-h" data-slot="partners" data-node>
          <p class="eyebrow" data-text="labels.partnersEyebrow"></p>
          <h2 class="h" id="part-h" data-text="labels.partnersHeading"></h2>
        </section>
      </div>

      <!-- ===== SPEAKERS (spec §5.16): keynotes and spotlight, then partner speakers ===== -->
      <section class="s wrap rv rv-rows" data-section="speakers" aria-labelledby="spk-h" data-node>
        <p class="eyebrow" data-text="labels.speakersEyebrow"></p>
        <h2 class="h" id="spk-h" data-text="labels.speakersHeading"></h2>
        <div data-slot="speakers"></div>
      </section>

      <!-- ===== QUESTIONS? (spec §5.8) ===== -->
      <section class="s wrap rv" data-section="questions" aria-labelledby="q-eyebrow" data-node>
        <p class="eyebrow" id="q-eyebrow" data-text="labels.questionsEyebrow"></p>
        <div class="questions" data-slot="contacts"></div>
      </section>

      <!-- ===== THE DOOR (spec §5.17): the app action again, where the trace ends. Same words, no new copy. ===== -->
      <div class="wrap door rv" data-section="door" data-slot="door" data-node data-end></div>

      <!-- ===== WRAPPED: the resources line (spec §5.9d), the last word and the trace's terminal. The §5.2 pending line: a status,
           not a link, not focusable. Removed (not hidden) when materialsLinked is true; the terminal then moves to partners. ===== -->
      <div class="wrap wnext" data-section="resources" data-node data-end>
        <p class="pending" data-anchor><span data-text="wrappedFlair.resources"></span></p>
      </div>
    </main>

    <!-- ===== FOOTER (spec §5.10) ===== -->
    <div class="wrap">
      <footer class="foot" data-section="footer">
        <div class="foot-row">
          <div class="lic">
            <img class="logo" src="img/logo-base.svg" alt="PGW" width="143" height="20">
            <strong data-text="footer.name"></strong>
            <span data-slot="licence-numbers"></span>
          </div>
          <nav class="policies" aria-label="PGW policies" data-slot="policies"></nav>
        </div>
        <p class="copy" data-text="footer.copyright"></p>
      </footer>
    </div>
  </div>
</template>
</body>
</html>
